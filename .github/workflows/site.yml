name: Recruitment site and official-source updates
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Check official recruitment sources before publishing
        type: boolean
        default: false
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: read
concurrency:
  group: recruitment-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official-source parsers
        run: python -m pip install -r requirements.txt
      - name: Check official sources and retain failures
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.refresh
        run: python scripts/update_site.py
      - name: Validate recruitment parsing and matching
        run: python -m unittest discover -s tests -v
      - name: Build public site without a private profile
        run: python scripts/build_site.py
      - name: Retain the public recruitment snapshot
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verified_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official recruitment snapshot'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
